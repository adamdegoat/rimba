<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Green Cave · Rimba</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1c160e;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f3ecdd;overflow:hidden}
  #scene{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;display:flex}
  #scene::-webkit-scrollbar{display:none}
  #scene{scrollbar-width:none}
  #scene svg{height:100%;width:auto;min-width:100%;flex:0 0 auto;margin:auto;display:block}
  #cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:rgba(243,236,221,.86);
    text-shadow:0 2px 10px #000;padding:0 18px;z-index:5;pointer-events:none;font-weight:600}
  #back{position:fixed;top:12px;left:12px;z-index:6;background:rgba(28,22,14,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    border:1px solid rgba(212,188,140,.32);color:#f6efe0;text-decoration:none;font-weight:700;font-size:13px;padding:8px 14px;border-radius:11px}
  #title{position:fixed;top:12px;right:12px;z-index:6;display:flex;align-items:center;gap:9px;background:rgba(28,22,14,.66);backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);border:1px solid rgba(120,170,110,.34);border-radius:13px;padding:7px 14px}
  #title .t-ic{font-size:17px}
  #title .t-main{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.06em;color:#cfe6b8;font-size:18px;line-height:1}
  #title .t-sub{font:600 9.5px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,236,221,.55);margin-top:3px}
  #hint{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:6;pointer-events:none;background:rgba(28,22,14,.72);
    border:1px solid rgba(255,255,255,.18);color:#f0e7d2;font:700 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.5px;padding:7px 13px;border-radius:999px;opacity:0;white-space:nowrap}
  #hint.show{animation:hint 3.4s ease-in-out forwards}
  @keyframes hint{0%{opacity:0;transform:translateX(-50%) translateY(6px)}14%{opacity:1;transform:translateX(-50%) translateY(0)}74%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-5px)}}
  .gc-steam{transform-box:fill-box;transform-origin:bottom center;animation:gcSteam 4s ease-in-out infinite}
  @keyframes gcSteam{0%{opacity:0;transform:translateY(0) scaleX(1)}30%{opacity:.5}100%{opacity:0;transform:translateY(-30px) scaleX(1.7)}}
  .gc-flick{transform-box:fill-box;transform-origin:50% 100%;animation:gcFlick .5s ease-in-out infinite alternate}
  @keyframes gcFlick{from{transform:scaleY(.9) scaleX(1.05)}to{transform:scaleY(1.12) scaleX(.94)}}
  .gc-glow{animation:gcGlow 3s ease-in-out infinite}
  @keyframes gcGlow{0%,100%{opacity:.5}50%{opacity:.85}}
  .gc-sway{transform-box:fill-box;transform-origin:top center;animation:gcSway 6.5s ease-in-out infinite}
  .gc-sway2{transform-box:fill-box;transform-origin:top center;animation:gcSway 9s ease-in-out infinite reverse}
  @keyframes gcSway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
  .gc-mote{transform-box:fill-box;transform-origin:center;animation:gcMote 11s ease-in-out infinite}
  @keyframes gcMote{0%{opacity:0;transform:translate(0,0)}30%{opacity:.7}70%{opacity:.55}100%{opacity:0;transform:translate(16px,-34px)}}
  .gc-shim{animation:gcShim 4.5s ease-in-out infinite}
  @keyframes gcShim{0%,100%{opacity:.3}50%{opacity:.6}}
  .gc-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:gcBreathe 4.8s ease-in-out infinite}
  @keyframes gcBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
  .gc-tail{transform-box:fill-box;transform-origin:0% 100%;animation:gcTail 3.8s ease-in-out infinite}
  @keyframes gcTail{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-8deg)}}
  .gc-bub{transform-box:fill-box;transform-origin:center;animation:gcBub 1.9s ease-in infinite}
  @keyframes gcBub{0%{transform:translateY(0);opacity:0}30%{opacity:.85}100%{transform:translateY(-13px);opacity:0}}
  .gc-smoke{transform-box:fill-box;transform-origin:bottom center;animation:gcSmoke 5.5s ease-in-out infinite}
  @keyframes gcSmoke{0%{opacity:0;transform:translateY(0) translateX(0) scale(.6)}24%{opacity:.42}100%{opacity:0;transform:translateY(-48px) translateX(12px) scale(1.7)}}
  .gc-neon{animation:gcNeon 5s ease-in-out infinite}
  @keyframes gcNeon{0%,100%{opacity:.9}47%{opacity:.9}49%{opacity:.45}51%{opacity:.95}53%{opacity:.7}55%{opacity:.95}}
  .gc-ember{animation:gcEmber 2.4s ease-in-out infinite}
  @keyframes gcEmber{0%,100%{opacity:.55}50%{opacity:1}}
</style></head>
<body>
<div id="scene"></div>
<a id="back" href="behind-the-falls.html?g=1">↩ back to the falls</a>
<div id="title"><span class="t-ic">🌿</span><div><div class="t-main">The Green Cave</div><div class="t-sub">boutique café · dispensary</div></div></div>
<div id="cap">A hidden boutique carved into the rock — cannabis on the counter, coffee on the bar, jungle light spilling in.</div>
<div id="hint">⟷ drag to look around</div>
<script>
const F=n=>(+n).toFixed(1);
let _raf=null;
function startParallax(){ if(_raf) cancelAnimationFrame(_raf);
  const sc=document.getElementById('scene'); const layers=[...sc.querySelectorAll('.lkL')]; if(!layers.length) return;
  let mx=0,my=0; sc.addEventListener('pointermove',e=>{const r=sc.getBoundingClientRect(); if(!r.width)return; mx=((e.clientX-r.left)/r.width-0.5)*2; my=((e.clientY-r.top)/r.height-0.5)*2;});
  let t0=null; const tick=ts=>{ if(t0==null)t0=ts; const t=(ts-t0)/1000, d=Math.sin(t*0.4)*0.4, AX=11, AY=4;
    for(const g of layers){const px=parseFloat(g.getAttribute('data-px'))||0; g.setAttribute('transform',`translate(${((mx+d)*AX*px).toFixed(2)} ${(my*AY*px).toFixed(2)})`);} _raf=requestAnimationFrame(tick);}; _raf=requestAnimationFrame(tick); }

// ── a leafy plant (monstera-ish / palm) for greenery ──
function frond(x,y,sc,rot,c){ let g=`<g transform="translate(${F(x)} ${F(y)}) rotate(${rot}) scale(${sc})">`;
  const angs=[-66,-40,-16,8,32,58], lens=[40,58,72,66,52,38];
  angs.forEach((a,i)=>{ g+=`<g transform="rotate(${a})"><path d="M 0 0 Q ${F(lens[i]*0.5)} ${F(-lens[i]*0.4)} ${F(lens[i]*0.2)} ${F(-lens[i])} Q ${F(-lens[i]*0.2)} ${F(-lens[i]*0.5)} 0 0 Z" fill="${c}"/></g>`; });
  return g+'</g>'; }
function monstera(x,y,sc,c,c2){ let g=`<g transform="translate(${F(x)} ${F(y)}) scale(${sc})">`;
  // woven/terracotta pot grounding the plant
  g+=`<path d="M -30 0 L 30 0 L 24 34 L -24 34 Z" fill="#b9824a"/><path d="M -30 0 L 30 0 L 24 34 L -24 34 Z" fill="none" stroke="#8a5e30" stroke-width="1.5"/><g stroke="#8a5e30" stroke-width="1.2" opacity=".5"><line x1="-27" y1="11" x2="27" y2="11"/><line x1="-26" y1="22" x2="26" y2="22"/></g><rect x="-33" y="-5" width="66" height="7" rx="3" fill="#caa46a"/><ellipse cx="0" cy="-2" rx="27" ry="5" fill="#3a2c1a"/>`;
  // stems + swaying leaves rooted in the pot
  g+=`<g class="gc-sway" style="transform-origin:50% 100%">`;
  const lv=[[-44,-34,0.92,-26],[34,-46,1.0,18],[-10,-72,1.08,-4],[-56,-60,0.78,-44],[44,-24,0.76,42]];
  lv.forEach(([lx,ly,ls,lr])=>{ g+=`<path d="M 0 -2 Q ${lx*0.5} ${ly*0.5} ${lx} ${ly}" stroke="#3a5f2a" stroke-width="${F(3.2)}" fill="none" stroke-linecap="round"/>`;
    g+=`<g transform="translate(${lx} ${ly}) rotate(${lr}) scale(${ls})"><path d="M 0 0 Q -34 -18 -30 -52 Q -16 -78 0 -82 Q 16 -78 30 -52 Q 34 -18 0 0 Z" fill="${c}"/>`;
    g+=`<g stroke="${c2}" stroke-width="2.4" opacity=".5"><path d="M 0 -4 L 0 -76 M 0 -30 L -16 -42 M 0 -30 L 16 -42 M 0 -52 L -12 -62 M 0 -52 L 12 -62"/></g>`;
    g+=`<g fill="${c2}" opacity=".4"><ellipse cx="-12" cy="-40" rx="4" ry="8"/><ellipse cx="12" cy="-40" rx="4" ry="8"/><ellipse cx="-9" cy="-58" rx="3" ry="6"/><ellipse cx="9" cy="-58" rx="3" ry="6"/></g></g>`; });
  return g+'</g></g>'; }
// apothecary jar of cannabis on a shelf
function jar(x,y,sc,bud){ const s=sc; return `<g transform="translate(${F(x)} ${F(y)}) scale(${s})"><rect x="-9" y="-22" width="18" height="24" rx="4" fill="#caa46a" opacity=".34"/><rect x="-9" y="-22" width="18" height="24" rx="4" fill="none" stroke="#e8d6a8" stroke-width="1.2" opacity=".6"/><rect x="-10" y="-26" width="20" height="6" rx="2" fill="#8a6a3a"/><g fill="${bud}">${[[-4,-4],[3,-3],[-1,-8],[5,-7],[-6,-9]].map(([bx,by])=>`<circle cx="${bx}" cy="${by}" r="3.4"/>`).join('')}</g></g>`; }
// a glass water-pipe (bong) — translucent glass, water + rising bubbles, side bowl, highlight
function bong(x,y,sc,tint){ const gl=tint||'#bfe6e0';
  let g=`<g transform="translate(${F(x)} ${F(y)}) scale(${sc})">`;
  g+=`<path d="M -16 0 Q -18 -4 -14 -8 L -8 -34 L 8 -34 L 14 -8 Q 18 -4 16 0 Z" fill="${gl}" opacity=".3"/>`;       // beaker base glass
  g+=`<path d="M -13 -7 L 13 -7 L 9 -24 L -9 -24 Z" fill="#6fbfb6" opacity=".5"/>`;                                 // water
  g+=`<g fill="#fff" opacity=".8"><circle class="gc-bub" cx="-3" cy="-11" r="1.4"/><circle class="gc-bub" style="animation-delay:.7s" cx="3" cy="-9" r="1.1"/><circle class="gc-bub" style="animation-delay:1.2s" cx="0" cy="-15" r="1.2"/></g>`;
  g+=`<rect x="-6" y="-74" width="12" height="42" rx="2" fill="${gl}" opacity=".28"/>`;                              // tube
  g+=`<path d="M -8 -74 L 8 -74 L 6 -80 L -6 -80 Z" fill="${gl}" opacity=".4"/>`;                                   // mouthpiece flare
  g+=`<line x1="7" y1="-28" x2="19" y2="-38" stroke="#dff3ef" stroke-width="3" opacity=".7"/><ellipse cx="21" cy="-40" rx="5" ry="3.5" fill="#5a3a1f"/>`; // downstem + bowl
  g+=`<g fill="none" stroke="#eafffb" stroke-width="1.3" opacity=".7"><path d="M -16 0 Q -18 -4 -14 -8 L -8 -34"/><path d="M 14 -8 L 8 -34"/><rect x="-6" y="-74" width="12" height="42" rx="2"/></g>`; // glass outlines
  g+=`<rect x="-4" y="-70" width="2.4" height="58" rx="1" fill="#fff" opacity=".5"/>`;                              // highlight streak
  return g+'</g>'; }
// a stylised person: {x,y,sc,skin,hair,hairstyle:short|long|bun,shirt,apron,pants,pose:stand|sit|counter,hold}
function person(o){ const {x,y,sc=1,skin='#e3b68e',hair='#2c2018',hairstyle='short',shirt='#7a8a52',apron,pants='#3a2c1a',pose='stand',hold}=o;
  let g=`<g transform="translate(${F(x)} ${F(y)}) scale(${sc})">`, hcy=-36;
  if(pose==='sit'){
    g+=`<g fill="none" stroke="#a9824a" stroke-width="4"><rect x="-17" y="-32" width="34" height="40" rx="6"/><line x1="-17" y1="-18" x2="17" y2="-18"/></g>`; // rattan chair
    g+=`<rect x="-11" y="14" width="9" height="22" rx="4" fill="${pants}"/><rect x="2" y="14" width="9" height="22" rx="4" fill="${pants}"/>`;          // shins
    g+=`<rect x="-12" y="5" width="11" height="12" rx="4" fill="${pants}"/><rect x="1" y="5" width="11" height="12" rx="4" fill="${pants}"/>`;           // thighs
    g+=`<path d="M -13 8 Q -16 -22 0 -28 Q 16 -22 13 8 Z" fill="${shirt}"/>`;                                                                          // torso
    g+=`<path d="M -12 -16 Q -20 -6 -18 6" stroke="${shirt}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    g+=`<path d="M 12 -16 Q 26 -12 32 -3" stroke="${shirt}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="33" cy="-2" r="4.5" fill="${skin}"/>`; // arm to table
    hcy=-30;
  } else {
    g+=`<rect x="-10" y="0" width="9" height="26" rx="4" fill="${pants}"/><rect x="1" y="0" width="9" height="26" rx="4" fill="${pants}"/>`;
    g+=`<path d="M -13 2 Q -15 -30 0 -36 Q 15 -30 13 2 Z" fill="${shirt}"/>`;
    if(apron) g+=`<path d="M -10 -24 L 10 -24 L 9 2 L -9 2 Z" fill="${apron}" opacity=".94"/><path d="M -8 -24 q 8 5 16 0" fill="none" stroke="#3a2c1a" stroke-width="1.4"/>`;
    if(pose==='counter'){ g+=`<path d="M -11 -28 Q -22 -20 -26 -9" stroke="${shirt}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="-27" cy="-8" r="4.5" fill="${skin}"/><path d="M 11 -28 Q 20 -20 24 -11" stroke="${shirt}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="25" cy="-10" r="4.5" fill="${skin}"/>`; }
    else { g+=`<path d="M -12 -30 Q -19 -18 -17 -4" stroke="${shirt}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="-17" cy="-3" r="4.5" fill="${skin}"/><path d="M 12 -30 Q 19 -18 17 -4" stroke="${shirt}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="17" cy="-3" r="4.5" fill="${skin}"/>`; }
  }
  g+=`<rect x="-3.5" y="${hcy+4}" width="7" height="8" rx="2" fill="${skin}"/>`;                          // neck
  g+=`<circle cx="0" cy="${hcy-9}" r="11.5" fill="${skin}"/><ellipse cx="0" cy="${hcy-3}" rx="11" ry="6" fill="${skin}"/>`; // head + jaw
  if(hairstyle==='bun') g+=`<circle cx="0" cy="${hcy-23}" r="6.5" fill="${hair}"/><path d="M -11 ${hcy-9} Q -12 ${hcy-24} 0 ${hcy-24} Q 12 ${hcy-24} 11 ${hcy-9} Q 6 ${hcy-16} 0 ${hcy-15} Q -6 ${hcy-16} -11 ${hcy-9} Z" fill="${hair}"/>`;
  else if(hairstyle==='long') g+=`<path d="M -12 ${hcy-9} Q -13 ${hcy-25} 0 ${hcy-25} Q 13 ${hcy-25} 12 ${hcy-9} L 13 ${hcy+10} L 7 ${hcy+10} Q 8 ${hcy-7} 0 ${hcy-7} Q -8 ${hcy-7} -7 ${hcy+10} L -13 ${hcy+10} Z" fill="${hair}"/>`;
  else g+=`<path d="M -11 ${hcy-9} Q -12 ${hcy-25} 0 ${hcy-25} Q 12 ${hcy-25} 11 ${hcy-9} Q 6 ${hcy-17} 0 ${hcy-16} Q -6 ${hcy-17} -11 ${hcy-9} Z" fill="${hair}"/>`;
  g+=`<g fill="#2a1c12"><circle cx="-4" cy="${hcy-9}" r="1.4"/><circle cx="4" cy="${hcy-9}" r="1.4"/></g><path d="M -3 ${hcy-3} q 3 2 6 0" stroke="#a86a4a" stroke-width="1" fill="none" opacity=".7"/>`;
  if(hold) g+=hold;
  return g+'</g>'; }

function build(){
  if(document.getElementById('gc-svg')) return;
  const hr=new Date().getHours(); const N=(hr<6||hr>=19), DUSK=(hr>=17&&hr<19);
  // warm earthy palette — Thai boutique nature café in a limestone cave
  const wall1=N?'#6e5c40':'#c2ad84', wall2=N?'#3e3422':'#8a7450', floor1=N?'#5a472e':'#9c7e54', floor2=N?'#36281a':'#6e5636';
  const wood=N?'#6b4e2e':'#9c7340', woodD=N?'#3f2c18':'#5e4326', stoneTop=N?'#7a6a4e':'#d8c9a8';
  const green=N?'#2e5a32':'#3f8a44', greenD=N?'#1c3a20':'#28602c', greenL=N?'#3f7a44':'#5fb05a';
  const brass=N?'#a07a3a':'#caa44e', cream='#efe6cf', amber='#e0a878';
  const lamp='#ffce7a', sky = N?'#23314f':DUSK?'#e8a36a':'#bfe0c8';
  const shaftO=N?.10:DUSK?.30:.42;

  let s=`<svg id="gc-svg" viewBox="0 0 1400 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="gcwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wall1}"/><stop offset="1" stop-color="${wall2}"/></linearGradient>
    <linearGradient id="gcfloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${floor1}"/><stop offset="1" stop-color="${floor2}"/></linearGradient>
    <linearGradient id="gcshaft" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="${sky}" stop-opacity="${shaftO}"/><stop offset="1" stop-color="${sky}" stop-opacity="0"/></linearGradient>
    <radialGradient id="gcsky" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="${sky}"/><stop offset="1" stop-color="${sky}" stop-opacity=".3"/></radialGradient>
    <radialGradient id="gclamp" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="${lamp}" stop-opacity="${N?'.6':'.4'}"/><stop offset="1" stop-color="${lamp}" stop-opacity="0"/></radialGradient>
    <radialGradient id="gccandle" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb24d" stop-opacity="${N?'.7':'.42'}"/><stop offset="1" stop-color="#ffb24d" stop-opacity="0"/></radialGradient>
    <linearGradient id="gcglass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gcvig" cx="50%" cy="42%" r="74%"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#160f06" stop-opacity="${N?'.6':'.4'}"/></radialGradient>
    <linearGradient id="gcrock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${N?'#4a3a26':'#6e5638'}"/><stop offset="1" stop-color="${N?'#221a10':'#3a2c1a'}"/></linearGradient></defs>`;
  // base
  s+=`<rect width="1400" height="600" fill="url(#gcwall)"/>`;
  // ── cave shell: warm rock ceiling arch + side walls frame the boutique (so it reads as a CAVE) ──
  s+=`<path d="M 0 0 L 1400 0 L 1400 100 Q 1180 138 1000 104 Q 700 146 400 104 Q 200 134 0 100 Z" fill="url(#gcrock)"/>`;
  s+=`<g fill="${N?'#1a140c':'#2a2014'}" opacity=".6">${[150,420,700,980,1250].map(x=>`<path d="M ${x} 100 q 6 26 0 44 q -6 -18 -10 -40 Z"/>`).join('')}</g>`;
  s+=`<path d="M 0 0 L 0 600 L 104 600 Q 64 360 120 150 Q 44 64 0 56 Z" fill="url(#gcrock)"/>`;
  s+=`<path d="M 1400 0 L 1400 600 L 1296 600 Q 1336 360 1280 150 Q 1356 64 1400 56 Z" fill="url(#gcrock)"/>`;
  // soft warm rock texture on the shell
  s+=`<g stroke="${N?'#160f08':'#2a2014'}" stroke-width="2" fill="none" opacity=".4">${[[40,180,40],[70,340,46],[1336,210,44],[1360,360,40]].map(([x,y,l])=>`<path d="M ${x} ${y} q 16 ${l*.5} 6 ${l}"/>`).join('')}</g>`;

  // ══ Layer A: back cave wall + a jungle skylight opening + warm niches ══
  s+=`<g class="lkL" data-px=".05">`;
  // warm rock striations
  s+=`<g stroke="${woodD}" stroke-width="2.5" fill="none" opacity=".22">${[120,210,300,150,260].map((y,i)=>`<path d="M ${i*300} ${y} q 200 ${i%2?14:-14} 420 0 q 200 ${i%2?-14:14} 420 0"/>`).join('')}</g>`;
  // skylight cave opening (top-centre) with daylight + jungle leaves spilling in
  s+=`<path d="M 560 -10 Q 700 -10 840 -10 Q 880 70 820 120 Q 700 150 580 120 Q 520 70 560 -10 Z" fill="url(#gcsky)"/>`;
  s+=`<path d="M 700 96 L 600 480 L 800 480 Z" fill="url(#gcshaft)"/>`;
  s+=`<g fill="${greenD}">${[[560,40,-30],[840,40,40],[600,90,-12],[800,96,18],[700,120,0]].map(([lx,ly,lr])=>`<g transform="translate(${lx} ${ly}) rotate(${lr})">${frond(0,0,0.7,0,greenD)}</g>`).join('')}</g>`;
  // backlit wall niches with jars + a small plant
  s+=`<g>${[[170,150],[1090,160],[1250,150]].map(([nx,ny])=>`<rect x="${nx-44}" y="${ny-46}" width="88" height="92" rx="8" fill="${N?'#2a2014':'#7a6444'}"/><rect x="${nx-44}" y="${ny-46}" width="88" height="92" rx="8" fill="url(#gclamp)"/><line x1="${nx-40}" y1="${ny}" x2="${nx+40}" y2="${ny}" stroke="${woodD}" stroke-width="4"/>${jar(nx-22,ny,1,greenD)}${jar(nx,ny,1,'#7c5a32')}${jar(nx+22,ny,1,greenD)}<g transform="translate(${nx-10} ${ny-46})">${frond(0,0,0.5,0,green)}</g>`).join('')}</g>`;
  // ROUND 3 — back-wall decor: framed botanical prints, a woven hanging, a living plant-wall accent
  s+=`<g>${[[440,150],[940,150]].map(([fx,fy])=>`<rect x="${fx-30}" y="${fy-38}" width="60" height="76" rx="3" fill="${N?'#241a10':'#5e4a30'}" stroke="${brass}" stroke-width="2"/><rect x="${fx-24}" y="${fy-32}" width="48" height="64" fill="${N?'#3a4a30':'#cfd8b8'}"/><g transform="translate(${fx} ${fy+18}) scale(.7)">${frond(0,0,1,0,green)}</g>`).join('')}</g>`;
